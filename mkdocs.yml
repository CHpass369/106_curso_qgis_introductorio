site_name: 106 - Curso Introductorio QGIS
site_description: Documentación y material del curso de QGIS
site_author: Chpass
site_url: https://chpass369.github.io/106_curso_qgis_introductorio/

repo_url: https://github.com/chpass369/106_curso_qgis_introductorio
repo_name: chpass369/106_curso_qgis_introductorio
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/images/logo.png
  favicon: assets/images/logo.png

  icon:
    repo: fontawesome/brands/github

  palette:
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo claro

    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo oscuro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

plugins:
  - search

# Un solo bloque de extensiones (antes había dos y YAML descartaba uno)
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  announcement: >
    📘 <strong>Curso de QGIS</strong> — Material del curso, prácticas y recursos complementarios.

extra_css:
  - assets/css/extra.css
  - assets/css/latlon.css

extra_javascript:
  - assets/vendor/d3.v7.min.js
  - assets/js/latlon.js

nav:
  - Inicio: index.md
  - Acerca:
      - Instructor: instructor.md
      - Syllabus: syllabus.md
      - Videos Tutoriales: videos.md
      - Material de apoyo: material.md
      - Agradecimientos: agradecimientos.md
      - Acerca del curso: acerca.md

  - Curso:
      - Programa: programa.md

  - "Mod1 · Fundamentos SIG":
      - Introducción: modulo-01/index.md
      - SIG y territorio:
          - 1.1 Sistemas de Información Geográfica: modulo-01/01-sistemas-informacion-geografica.md
          - 1.2 Espacio geográfico y territorio: modulo-01/02-espacio-geografico.md
      - Geodesia y sistemas de referencia:
          - 1.3 Fundamentos de Geodesia: modulo-01/03-fundamentos-geodesia.md
          - 1.4 Sistemas de Referencia de Coordenadas: modulo-01/04-sistemas-referencia.md
          - 1.5 Proyecciones cartográficas: modulo-01/05-proyecciones-cartograficas.md
          - 1.6 Sistema UTM: modulo-01/06-sistema-utm.md
      - Cartografía y escala:
          - 1.7 Fundamentos de Cartografía: modulo-01/07-fundamentos-cartografia.md
          - 1.8 Escala cartográfica: modulo-01/08-escala-cartografica.md
          - 1.9 Escala, resolución y precisión: modulo-01/09-escala-resolucion-precision.md
          - 1.10 Generalización cartográfica: modulo-01/10-generalizacion-cartografica.md
      - Datos geoespaciales:
          - 1.11 Modelos de representación espacial: modulo-01/11-modelos-representacion.md
          - 1.12 El dato geoespacial: modulo-01/12-dato-geoespacial.md
          - 1.13 Calidad de la información geográfica: modulo-01/13-calidad-informacion.md
      - Panorama geotecnológico:
          - 1.14 SIG y otras geotecnologías: modulo-01/14-sig-otras-geotecnologias.md
          - 1.15 Ecosistema de geotecnologías: modulo-01/15-ecosistema-geotecnologias.md
      - Práctica: modulo-01/practica.md

  - "Mod2 · Introducción a QGIS":
      - Introducción: modulo-02/index.md
      - Entorno y proyectos:
          - 2.1 Preparar un entorno de trabajo: modulo-02/01-entorno-trabajo.md
          - 2.2 Orientarse y trabajar con fluidez: modulo-02/02-orientarse-interfaz.md
          - 2.3 Comprender y gestionar proyectos: modulo-02/03-gestionar-proyectos.md
      - Datos y coordenadas:
          - 2.4 Incorporar datos y reconocer sus diferencias: modulo-02/04-incorporar-datos.md
          - 2.5 Convertir una tabla en información geográfica: modulo-02/05-tablas-coordenadas.md
          - 2.6 Resolver problemas de coordenadas: modulo-02/06-problemas-coordenadas.md
      - Explorar y consultar:
          - 2.7 Leer los datos antes de utilizarlos: modulo-02/07-leer-datos.md
          - 2.8 Seleccionar, filtrar y extraer información: modulo-02/08-seleccionar-filtrar.md
      - Representar y conectar:
          - 2.9 Representar y etiquetar datos vectoriales: modulo-02/09-simbologia-etiquetas.md
          - 2.10 Explorar imágenes y superficies ráster: modulo-02/10-explorar-raster.md
          - 2.11 Conectar información disponible en internet: modulo-02/11-servicios-web.md
      - Taller:
          - 2.12 Construir y entregar un proyecto funcional: modulo-02/12-taller-proyecto.md

  # Mod3 aplica en QGIS la teoría de 1.3–1.6 (títulos provisionales)
  - "Mod3 · Edición, integración y análisis espacial":
      - Introducción: modulo-03/index.md
      - Preparar, digitalizar y editar:
        - 3.1 Preparar datos confiables: modulo-03/01-preparar-datos-confiables.md
        - 3.2 Digitalizar y editar con precisión: modulo-03/02-digitalizar-editar-precision.md
      - Diseñar Formularios:
        - 3.3 Diseñar formularios de captura: modulo-03/03-disenar-formularios-captura.md
      - Analizar y combinar información:
        - 3.4 Construir indicadores con expresiones: modulo-03/04-construir-indicadores-expresiones.md
        - 3.5 Integrar tablas sin perder información: modulo-03/05-integrar-tablas.md
        - 3.6 Traducir preguntas en relaciones espaciales: modulo-03/06-relaciones-espaciales.md
        - 3.7 Analizar proximidad y superposición: modulo-03/07-proximidad-superposicion.md
      - Raster y Geoprocesamiento:
        - 3.8 Preparar y combinar datos ráster: modulo-03/08-preparar-combinar-raster.md
        - 3.9 Interpretar el relieve y resumirlo por zonas: modulo-03/09-relieve-estadisticas-zonales.md
        - 3.10 Recuperar información de mapas históricos: modulo-03/10-georreferenciar-mapas-historicos.md
        - 3.11 Construir procedimientos reproducibles: modulo-03/11-procedimientos-reproducibles.md
      - Taller:
        - 3.12 Laboratorio · Justificar una decisión territorial: modulo-03/12-laboratorio-decision-territorial.md

  - "Mod4 · Diseño cartográfico, composición y publicación":
      - Introducción: modulo-04/index.md

      - Encargo y escala:
          - 4.1 Definir el encargo cartográfico: modulo-04/01-definir-encargo-cartografico.md
          - 4.2 Preparar información para la escala de salida: modulo-04/02-preparar-informacion-escala-salida.md

      - Representación temática:
          - 4.3 Elegir una representación temática adecuada: modulo-04/03-elegir-representacion-tematica.md
          - 4.4 Evaluar clasificaciones y colores: modulo-04/04-evaluar-clasificaciones-colores.md
          - 4.5 Construir una jerarquía visual: modulo-04/05-construir-jerarquia-visual.md

      - Etiquetado:
          - 4.6 Resolver el etiquetado de mapas complejos: modulo-04/06-resolver-etiquetado-mapas-complejos.md

      - Composición:
          - 4.7 Diseñar una composición reutilizable: modulo-04/07-disenar-composicion-reutilizable.md
          - 4.8 Coordinar mapas y elementos complementarios: modulo-04/08-coordinar-mapas-elementos-complementarios.md

      - Automatización cartográfica:
          - 4.9 Incorporar información dinámica: modulo-04/09-incorporar-informacion-dinamica.md
          - 4.10 Producir un atlas territorial: modulo-04/10-producir-atlas-territorial.md

      - Publicación:
          - 4.11 Revisar y exportar para distintos usos: modulo-04/11-revisar-exportar-distintos-usos.md

      - Taller:
          - 4.12 Taller editorial · Publicar una colección coherente: modulo-04/12-taller-editorial-publicar-coleccion-coherente.md

  - Prácticas:
      - Índice: practicas/index.md

  - Evaluaciones:
      - Índice: evaluaciones/index.md

  - Descargas:
      - Material del curso: descargas/index.md
